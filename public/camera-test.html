<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camera isolation test</title><style>body{font:16px system-ui;background:#161616;color:white;margin:20px}video{width:100%;max-height:55vh;background:black}button,select{font:inherit;padding:12px;margin:5px}pre{white-space:pre-wrap}</style><h1>Camera isolation test</h1><p>Choose a mode, start, and wait 15 seconds. Stop before switching modes.</p><select id="mode"><option value="basic">Default camera, no microphone</option><option value="front">Front camera, no microphone</option><option value="audio">Front camera with microphone</option><option value="low">Front camera 640 × 480, 15 fps</option><option value="rear">Rear camera, no microphone</option></select><button id="start">Start</button><button id="stop">Stop</button><video id="v" autoplay muted playsinline></video><pre id="log"></pre><script>
const v=document.querySelector('#v'),log=document.querySelector('#log');let stream,timer,frames=0,lastFrame=0,handle,run=0;
function stop(){run++;clearInterval(timer);if(handle!=null)v.cancelVideoFrameCallback?.(handle);stream?.getTracks().forEach(t=>t.stop());stream=null;v.srcObject=null;}
document.querySelector('#stop').onclick=stop;
document.querySelector('#start').onclick=async()=>{stop();const token=run;frames=0;lastFrame=0;const mode=document.querySelector('#mode').value;const video=mode==='basic'?true:mode==='low'?{facingMode:'user',width:{ideal:640},height:{ideal:480},frameRate:{ideal:15,max:15}}:{facingMode:mode==='rear'?'environment':'user'};try{const s=await navigator.mediaDevices.getUserMedia({video,audio:mode==='audio'});if(token!==run){s.getTracks().forEach(t=>t.stop());return;}stream=s;v.srcObject=s;await v.play();if(token!==run)return;const start=performance.now();const track=s.getVideoTracks()[0];function frame(now){if(token!==run)return;frames++;lastFrame=now;handle=v.requestVideoFrameCallback(frame);}if(v.requestVideoFrameCallback)handle=v.requestVideoFrameCallback(frame);timer=setInterval(()=>{const q=v.getVideoPlaybackQuality?.();log.textContent=JSON.stringify({mode,seconds:Math.round((performance.now()-start)/1000),frames:v.requestVideoFrameCallback?frames:q?.totalVideoFrames,lastFrameAgeMs:lastFrame?Math.round(performance.now()-lastFrame):null,paused:v.paused,readyState:v.readyState,trackState:track.readyState,muted:track.muted,settings:track.getSettings()},null,2);},500);}catch(e){if(token===run){stop();log.textContent=e.name+': '+e.message;}}};window.addEventListener('pagehide',stop);
</script></html>
