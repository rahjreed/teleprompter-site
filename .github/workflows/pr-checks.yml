name: Validate pull requests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install FFmpeg for real MP4 regression tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm test
      - run: npm run build
      - run: bash -n scripts/publish-production.sh
